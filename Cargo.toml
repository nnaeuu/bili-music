[package]
name = "bili-music"
version = "0.1.0"
edition = "2021"
description = "轻量级 B 站缓存音频管理播放器（仅本地演示）"

# 单文件可执行 + 轻量：release 下做体积与内存优化
[profile.release]
opt-level = "z"      # 以体积为优先
lto = true           # 链接时优化，进一步减小体积
codegen-units = 1    # 减少并行编译单元，利于 LTO
strip = true         # 剥离符号表
panic = "abort"      # 去掉 unwind 运行时

[dependencies]
# GUI 框架（egui 即时模式 GUI，eframe 提供窗口与事件循环）
eframe = "0.31"

# SQLite（bundled 特性会把 SQLite 源码一起编译进可执行文件，无需外部 dll）
rusqlite = { version = "0.32", features = ["bundled"] }

# 音频解码（仅保留 B 站缓存常见格式，减小体积）
symphonia = { version = "0.5", default-features = false, features = [
    "aac", "flac", "mp3", "wav", "pcm", "isomp4", "ogg", "vorbis",
] }

# 音频元数据（后续用于给合并出的音频写入标签）
lofty = "0.22"

# 文件夹监听（增量导入）
notify = "7.0"

# JSON 解析（B 站缓存的 entry.json）
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 错误处理
anyhow = "1"

# 音频播放（rodio 内部用 symphonia 解码，含 AAC 支持）
rodio = "0.19"
